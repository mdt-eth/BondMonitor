name: Aggiorna Pagina Web Bond

on:
  schedule:
    # Gira alle 18:00 UTC (20:00 ora svizzera estiva) dal Lunedì (1) al Venerdì (5)
    - cron: '0 18 * * 1-5'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui Script e Genera HTML
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY}}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bond_agent.py

      - name: Salva la pagina aggiornata
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Aggiornamento giornaliero bond dashboard"
          # Ora salva sia la pagina web che il file di memoria
          file_pattern: "index.html previous_data.json"
